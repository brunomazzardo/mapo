name: Mapo
options:
  bundleIdPrefix: dev.mapo
  deploymentTarget: { macOS: "26.0" }
  createIntermediateGroups: true
packages:
  MapoKit: { path: Packages/MapoKit }
settings:
  base:
    MAPO_PROFILE: debug
targets:
  Mapo:
    type: application
    platform: macOS
    sources: [Mapo]
    dependencies:
      - { package: MapoKit, products: [MapoProtocol, MapoClient, MapoTerminal, MapoUI, MapoAutomation] }
    info:
      path: Mapo/Info.plist
      properties:
        CFBundleDisplayName: Mapo Dev
        LSMinimumSystemVersion: "26.0"
    entitlements:
      path: Mapo/Mapo.entitlements
      properties:
        com.apple.security.device.camera: true
        com.apple.security.device.audio-input: true
        com.apple.security.personal-information.addressbook: true
        com.apple.security.personal-information.calendars: true
        com.apple.security.personal-information.location: true
        com.apple.security.personal-information.photos-library: true
        com.apple.security.automation.apple-events: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.mapo.app.dev
        PRODUCT_NAME: Mapo
        SWIFT_VERSION: "6.0"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        ENABLE_HARDENED_RUNTIME: YES
        # Xcode drops the runtime flag for ad-hoc signing unless asked explicitly.
        OTHER_CODE_SIGN_FLAGS: "--options runtime"
        ENABLE_DEBUG_DYLIB: NO
        ENABLE_PREVIEWS: NO
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        ARCHS: arm64
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
    postBuildScripts:
      - name: Embed mapo and resources
        script: "\"$SRCROOT/../scripts/embed.sh\""
        inputFiles: ["$(SRCROOT)/../target/$(MAPO_PROFILE)/mapo"]
        outputFiles: ["$(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/mapo"]
        basedOnDependencyAnalysis: false
