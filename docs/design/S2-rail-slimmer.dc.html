<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rail synthesis S2: slimmer</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#0F1013;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;text-align:left;cursor:default}
a{color:#8AB0FF}a:hover{color:#A6C3FF}
</style>
</helmet>
<div style="width: 320px; height: 760px; box-sizing: border-box; padding: 12px; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif; font-size: 12.5px; color: #D5D8DF; background: radial-gradient(600px 420px at 10% -10%, rgba(125, 166, 255, 0.14), transparent 62%), linear-gradient(180deg, #25272E 0%, #1F2127 100%)">
<aside aria-label="Workspaces" style="height: 736px; display: flex; flex-direction: column; border-radius: 14px; background: rgba(43, 46, 54, 0.62); -webkit-backdrop-filter: blur(28px) saturate(160%); backdrop-filter: blur(28px) saturate(160%); border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06), 0 8px 28px rgba(0, 0, 0, 0.28); overflow: hidden">
<div style="height: 50px; flex-shrink: 0; display: flex; align-items: center; gap: 6px; padding: 0 10px 0 16px">
<div style="display: flex; gap: 8px; align-items: center">
<span style="display: block; width: 12px; height: 12px; border-radius: 6px; background: #FF5F57"></span>
<span style="display: block; width: 12px; height: 12px; border-radius: 6px; background: #FEBC2E"></span>
<span style="display: block; width: 12px; height: 12px; border-radius: 6px; background: #28C840"></span>
</div>
<div style="flex-grow: 1"></div>
<button aria-label="Hide sidebar" style="width: 28px; height: 28px; border-radius: 7px; display: flex; align-items: center; justify-content: center; color: #A3A8B3"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5"></rect><path d="M9 5v14"></path></svg></button>
<button aria-label="New workspace" style="width: 28px; height: 28px; border-radius: 7px; display: flex; align-items: center; justify-content: center; color: #A3A8B3"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg></button>
</div>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 0; padding: 0 8px 8px">
<div style="padding: 6px 10px; font-size: 11px; font-weight: 600; color: #9EA3AE">Workspaces</div>

<button aria-label="Obsess, branch rate-limit, 1 needs you" style="display: flex; align-items: center; gap: 7px; height: 26px; padding: 0 10px; border-radius: 6px">
<span style="display: flex; color: #A3A8B3"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></span>
<span style="font-size: 13px; font-weight: 600; color: #F2F3F6">Obsess</span>
<span style="flex-grow: 1; font-size: 11.5px; color: #9EA3AE">rate-limit</span>
<span style="min-width: 16px; height: 16px; box-sizing: border-box; padding: 0 4px; border-radius: 8px; background: #E8B557; color: #1D1F25; font-size: 10.5px; font-weight: 700; display: flex; align-items: center; justify-content: center">1</span>
</button>

<button aria-label="be-claude, needs you" style="display: flex; align-items: center; gap: 8px; height: 24px; padding: 0 10px 0 26px; border-radius: 6px; background: rgba(138, 176, 255, 0.16)">
<span style="display: flex; color: #DCE3F2"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"></path><path d="M19 16l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z"></path></svg></span>
<span style="flex-grow: 1; color: #F1CB86">be-claude</span>
<span style="font-size: 11.5px; color: #E8B557">Needs you</span>
</button>
<button aria-label="fe-claude, working" style="display: flex; align-items: center; gap: 8px; height: 24px; padding: 0 10px 0 26px; border-radius: 6px">
<span style="display: flex; color: #A3A8B3"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"></path><path d="M19 16l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z"></path></svg></span>
<span style="flex-grow: 1">fe-claude</span>
<span style="display: block; width: 6px; height: 6px; border-radius: 3px; background: #6CA8FF"></span>
</button>
<button aria-label="api, serving on port 4000" style="display: flex; align-items: center; gap: 8px; height: 24px; padding: 0 10px 0 26px; border-radius: 6px">
<span style="display: flex; color: #A3A8B3"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="7" rx="2"></rect><rect x="4" y="13" width="16" height="7" rx="2"></rect><path d="M8 7.5h.01"></path><path d="M8 16.5h.01"></path></svg></span>
<span style="flex-grow: 1">api</span>
<span style="font-size: 11.5px; color: #9EA3AE">:4000</span>
</button>
<button aria-label="web, failed" style="display: flex; align-items: center; gap: 8px; height: 24px; padding: 0 10px 0 26px; border-radius: 6px">
<span style="display: flex; color: #A3A8B3"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="7" rx="2"></rect><rect x="4" y="13" width="16" height="7" rx="2"></rect><path d="M8 7.5h.01"></path><path d="M8 16.5h.01"></path></svg></span>
<span style="flex-grow: 1; color: #F6C9C5">web</span>
<span style="font-size: 11.5px; color: #F47067">Failed</span>
</button>
<button aria-label="zsh" style="display: flex; align-items: center; gap: 8px; height: 24px; padding: 0 10px 0 26px; border-radius: 6px">
<span style="display: flex; color: #A3A8B3"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7l5 5-5 5"></path><path d="M12 18h7"></path></svg></span>
<span style="flex-grow: 1">zsh</span>
</button>

<button aria-label="Mapo, working" style="display: flex; align-items: center; gap: 7px; height: 26px; padding: 0 10px; border-radius: 6px; margin-top: 6px">
<span style="display: flex; color: #A3A8B3"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></span>
<span style="flex-grow: 1; font-size: 13px; font-weight: 600">Mapo</span>
<span style="display: block; width: 6px; height: 6px; border-radius: 3px; background: #6CA8FF"></span>
</button>
<button aria-label="Site, done" style="display: flex; align-items: center; gap: 7px; height: 26px; padding: 0 10px; border-radius: 6px">
<span style="display: flex; color: #A3A8B3"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></span>
<span style="flex-grow: 1; font-size: 13px; font-weight: 600">Site</span>
<span style="display: block; width: 6px; height: 6px; border-radius: 3px; background: #6FCF97"></span>
</button>
<button aria-label="Dotfiles" style="display: flex; align-items: center; gap: 7px; height: 26px; padding: 0 10px; border-radius: 6px">
<span style="display: flex; color: #A3A8B3"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></span>
<span style="flex-grow: 1; font-size: 13px; font-weight: 600">Dotfiles</span>
</button>
</div>
</aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":320,"height":760}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
