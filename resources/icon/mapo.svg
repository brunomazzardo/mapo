<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#2F5BD8"/>
      <stop offset="1" stop-color="#15277A"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <clipPath id="squircle"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  </g>
  <g clip-path="url(#squircle)">
    <rect x="100" y="100" width="824" height="824" fill="url(#sheen)"/>
  </g>
  <!-- Workspace rail: three workspaces, the active one bright -->
  <rect x="196" y="236" width="150" height="552" rx="44" fill="#FFFFFF" fill-opacity="0.16"/>
  <rect x="226" y="276" width="90" height="90" rx="26" fill="#FFFFFF"/>
  <rect x="226" y="396" width="90" height="90" rx="26" fill="#FFFFFF" fill-opacity="0.45"/>
  <rect x="226" y="516" width="90" height="90" rx="26" fill="#FFFFFF" fill-opacity="0.45"/>
  <!-- Terminal -->
  <rect x="376" y="236" width="452" height="552" rx="44" fill="#0B1233" fill-opacity="0.55"/>
  <path d="M446 432 L528 494 L446 556" fill="none" stroke="#FFFFFF" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="566" y="534" width="150" height="44" rx="22" fill="#7FE0B5"/>
  <!-- Tree lines following the terminal -->
  <rect x="446" y="654" width="300" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.35"/>
  <rect x="490" y="704" width="210" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.22"/>
</svg>
